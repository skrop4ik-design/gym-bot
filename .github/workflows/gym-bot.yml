name: gym-bot

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

concurrency:
  group: gym-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Восстановить базу
        uses: actions/cache/restore@v4
        with:
          path: data
          key: gymdb-none
          restore-keys: gymdb-

      - name: Запустить бота (до 5 ч 40 мин)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          DB_PATH: data/gym.db
        run: |
          start=$(date +%s)
          timeout 340m python gym_bot.py || true
          echo "ELAPSED=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Сохранить базу
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: gymdb-${{ github.run_id }}

      - name: Запустить следующий цикл
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${ELAPSED:-0}" -gt 600 ]; then
            gh workflow run gym-bot.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          else
            echo "Бот проработал меньше 10 минут (ошибка токена или кода?) — цепочку не продолжаю."
          fi
